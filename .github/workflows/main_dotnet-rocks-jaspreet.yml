# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - dotnet-rocks-jaspreet

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: ./Dotnet101

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build --configuration Release

      # Publish directly to a local workspace path
      - name: dotnet publish
        run: dotnet publish DotnetWeb/DotnetWeb.csproj -c Release -r linux-x64 --self-contained true -o ./publish-output

      # Upload the exact publish folder
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: net-app
          path: Dotnet101/publish-output

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      # Download directly into a clean target directory
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: net-app
          path: ./app-to-deploy

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E6B96238ED1543A886504003C0DDD118 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_74C3895526D54DC98F752770E694FCF1 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E50D74B5D041441E9D35BB12B2ADF672 }}

      # Deploy specifically from the downloaded folder
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'dotnet-rocks-jaspreet'
          slot-name: 'Production'
          package: ./app-to-deploy
